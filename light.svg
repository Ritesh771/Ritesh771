    <!-- Floating animation for ASCII -->
    <g font-family="monospace" font-size="14" fill="url(#asciiGrad)" transform="translate(60, 100)" font-weight="bold" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="60,100; 60,95; 60,100" dur="4s" repeatCount="indefinite" />
      <text x="0" y="0" opacity="0">
        &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;,o888888o.&#160;&#160;&#160;&#160;&#160;
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0s" fill="freeze" />
      </text>
      <text x="0" y="18" opacity="0">
        &#160;&#160;&#160;&#160;&#160;&#160;&#160;888888888888.&#160;&#160;&#160;
