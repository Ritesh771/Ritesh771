<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
      <animate attributeName="cx" values="30%;70%;30%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="cy" values="30%;70%;30%" dur="15s" repeatCount="indefinite" />
    </radialGradient>
    
    <!-- ASCII Gradient -->
    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#2563EB;#06B6D4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#10B981;#2563EB" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glass Filter -->
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Typing Clips -->
    <clipPath id="typing1">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" from="0" to="400" dur="2s" fill="freeze" />
      </rect>
    </clipPath>
    
    <clipPath id="role1">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" values="0;300;300;0;0" keyTimes="0;0.1;0.9;1;1" dur="10s" begin="2s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="role2">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" values="0;0;0;300;300;0;0" keyTimes="0;0.2;0.2;0.3;0.9;1;1" dur="10s" begin="2s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- Base Background -->
  <rect width="1180" height="610" fill="#FFFFFF" rx="16" />
  <rect width="1180" height="610" fill="url(#bgGlow)" rx="16" />
  
  <!-- Outer Border Shimmer -->
  <rect width="1180" height="610" fill="none" stroke="rgba(15,23,42,.08)" stroke-width="2" rx="16" />

  <!-- LEFT SECTION (38%) -->
  <g transform="translate(40, 40)">
