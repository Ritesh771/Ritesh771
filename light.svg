        <text x="30" y="0" font-size="24" font-weight="600" fill="url(#asciiGrad)" opacity="0">
          Frontend Engineer
          <animate attributeName="opacity" values="0;1;1;0;0;0;0;0" keyTimes="0;0.05;0.2;0.25;1" dur="15s" repeatCount="indefinite" />
        </text>
        <text x="30" y="0" font-size="24" font-weight="600" fill="url(#asciiGrad)" opacity="0">
